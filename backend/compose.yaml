services:
  db:
    image: postgres:17
    container_name: cesaredu-postgresql
    environment:
      POSTGRES_DB: cesaredu
      POSTGRES_USER: cesaredu_user
      POSTGRES_PASSWORD: cesaredu_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cesaredu_user -d cesaredu"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    build: .
    container_name: cesaredu-backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      APP_DATABASE_HOST: db
      APP_DATABASE_PORT: 5432
      APP_DATABASE_NAME: cesaredu
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/cesaredu
      SPRING_DATASOURCE_USERNAME: cesaredu_user
      SPRING_DATASOURCE_PASSWORD: cesaredu_pass
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_SQL_INIT_MODE: always
      SPRING_PROFILES_ACTIVE: docker

volumes:
  postgres_data: