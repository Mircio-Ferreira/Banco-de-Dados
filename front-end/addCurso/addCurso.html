<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Novo Curso - CesarEdu</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<style>
    .form-container {
        max-width: 900px;
        margin: auto;
    }

    .box {
        background: rgba(255, 255, 255, 0.05);
        padding: 15px;
        border-radius: 10px;
        margin-bottom: 15px;
    }

    .box h3 {
        margin-bottom: 10px;
    }

    input,
    textarea {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
        margin-bottom: 10px;
        border-radius: 6px;
        border: none;
    }

    button {
        margin-top: 5px;
        padding: 6px 10px;
        cursor: pointer;
    }

    .nested {
        margin-left: 20px;
        border-left: 2px solid rgba(255, 255, 255, 0.2);
        padding-left: 10px;
    }

    .status {
        margin-top: 15px;
        padding: 10px;
        border-radius: 6px;
        font-size: 0.9em;
        white-space: pre-line;
        display: none;
    }

    .status.info { background: rgba(52, 152, 219, 0.2); display: block; }
    .status.ok   { background: rgba(46, 204, 113, 0.25); display: block; }
    .status.err  { background: rgba(231, 76, 60, 0.25); display: block; }

    .remove-btn {
        background: rgba(231, 76, 60, 0.7);
        color: white;
        border: none;
        border-radius: 4px;
        padding: 4px 8px;
        margin-left: 8px;
    }
</style>

<body>

    <header class="navbar">
        <div class="logo">
            <img src="../img/cesar_edu.png" />
            <a href="../home/home-professor.html">CesarEdu</a>
        </div>

        <input class="search" type="text" placeholder="O que você quer aprender?" />

        <div class="perfil">
            <span id="userName">Usuário</span>

            <button onclick="logout()" class="logout-btn">Sair</button>
        </div>
    </header>

    <div class="layout">

        <aside class="sidebar">
            <a href="../home/home-professor.html">🏠 Início</a>
            <a href="../certificados/certificadosProfessor.html">🏆 Certificados</a>
            <a href="../addCurso/addCurso.html">➕ Criar curso</a>
            <a href="../dashboardPreco/dashboardPreco.html">📊 Dashboard de Preços</a>
            <a href="../dashboardAlunosInativos/dashboardAlunosInativos.html">😴 Alunos Inativos</a>
            <a href="../dashboardProfessores/dashboardProfessores.html">🏆 Comparar Professores</a>
            <a href="../configuracoes/configuracoes.html">⚙️ Configurações</a>
        </aside>

        <main class="conteudo">
            <div class="form-container">

                <h2>Criar Curso</h2>

                <!-- 📚 CURSO -->
                <div class="box">
                    <h3>Curso</h3>
                    <input id="nomeCurso" placeholder="Nome do curso">
                    <input id="precoCurso" type="number" min="0" step="0.01" placeholder="Preço">
                    <textarea id="descricaoCurso" placeholder="Descrição"></textarea>
                </div>

                <!-- 🏷️ CATEGORIAS -->
                <div class="box">
                    <h3>Categorias</h3>
                    <input type="text" id="categoriaInput" placeholder="Ex: Programação, IA">
                    <small>Adicione uma ou mais categorias para o curso.</small>

                    <button type="button" onclick="addCategoria()">Adicionar categoria</button>

                    <div class="cert-list" id="categoriaList"></div>
                </div>

                <!-- 📦 MÓDULOS -->
                <div class="box">
                    <h3>Módulos</h3>
                    <button onclick="addModulo()">Adicionar módulo</button>
                    <div id="modulos"></div>
                </div>

                <button id="btnSalvar" onclick="criarCurso()">Salvar Curso</button>

                <div id="status" class="status"></div>

            </div>
        </main>
    </div>

    <script src="../js/auth.js"></script>
    <script src="../js/logout.js"></script>
    <script src="../js/reloadStorage.js"></script>
    <script src="addCurso.js"></script>
</body>

</html>
