<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Meus Certificados - CesarEdu</title>
    <link rel="stylesheet" href="../css/style.css">

    <style>
        .certificados-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 18px;
        }
        .certificados-header h2 { margin: 0; }
        .certificados-header .contagem {
            font-size: 0.9em;
            color: #94a3b8;
        }

        .filtros-cert {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 18px;
        }
        .filtros-cert input {
            flex: 1;
            min-width: 240px;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: #0f172a;
            color: #e2e8f0;
            font-size: 0.9em;
        }
        .filtros-cert input:focus {
            outline: none;
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.5);
        }
        .filtros-cert .gerenciar {
            padding: 8px 14px;
            border-radius: 6px;
            border: 1px solid rgba(56, 189, 248, 0.45);
            background: rgba(56, 189, 248, 0.15);
            color: #bae6fd;
            cursor: pointer;
            font-size: 0.9em;
            text-decoration: none;
            font-weight: bold;
        }
        .filtros-cert .gerenciar:hover {
            background: rgba(56, 189, 248, 0.25);
        }

        .certificados-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .cert-card {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 20px;
            position: relative;
            overflow: hidden;
            transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .cert-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #f59e0b, #fbbf24, #f59e0b);
        }
        .cert-card:hover {
            transform: translateY(-3px);
            border-color: rgba(251, 191, 36, 0.45);
            box-shadow: 0 10px 25px rgba(251, 191, 36, 0.15);
        }
        .cert-medalha {
            font-size: 2em;
            line-height: 1;
        }
        .cert-titulo {
            margin: 0;
            font-size: 1.05em;
            color: #f1f5f9;
            font-weight: bold;
            line-height: 1.3;
        }
        .cert-emissor {
            font-size: 0.82em;
            color: #94a3b8;
            margin-top: 2px;
        }
        .cert-rodape {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 8px;
            margin-top: auto;
            font-size: 0.78em;
            color: #cbd5e1;
        }
        .cert-rodape .verificado {
            color: #86efac;
            font-weight: bold;
        }

        .secao-vazia {
            padding: 30px;
            color: #94a3b8;
            font-style: italic;
            text-align: center;
            background: rgba(15, 23, 42, 0.4);
            border-radius: 10px;
            border: 1px dashed rgba(255, 255, 255, 0.08);
        }
        .secao-vazia .icone {
            font-size: 2.4em;
            display: block;
            margin-bottom: 8px;
            font-style: normal;
        }

        .resumo-prof {
            background: rgba(15, 23, 42, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 16px 18px;
            margin-bottom: 22px;
        }
        .resumo-prof .nome {
            font-size: 1.15em;
            color: #f1f5f9;
            font-weight: bold;
        }
        .resumo-prof .sub {
            font-size: 0.85em;
            color: #94a3b8;
            margin-top: 3px;
        }
    </style>
</head>

<body>

    <header class="navbar">
        <div class="logo">
            <img src="../img/cesar_edu.png" />
            <a href="../home/home-professor.html">CesarEdu</a>
        </div>

        <input class="search" type="text" placeholder="Pesquisar..." />

        <div class="perfil">
            <span id="userName">Usuário</span>
            <button onclick="logout()" class="logout-btn">Sair</button>
        </div>
    </header>

    <div class="layout">

        <aside class="sidebar">
            <a href="../home/home-professor.html">🏠 Início</a>
            <a href="../certificados/certificadosProfessor.html">🏆 Certificados</a>
            <a href="../addCurso/addCurso.html">➕ Criar curso</a>
            <a href="../dashboardPreco/dashboardPreco.html">📊 Dashboard de Preços</a>
            <a href="../dashboardAlunosInativos/dashboardAlunosInativos.html">😴 Alunos Inativos</a>
            <a href="../dashboardProfessores/dashboardProfessores.html">🏆 Comparar Professores</a>
            <a href="../configuracoes/configuracoes.html">⚙️ Configurações</a>
        </aside>

        <main class="conteudo">

            <div id="resumoProfessor" class="resumo-prof" style="display:none;">
                <div class="nome" id="resumoNome">—</div>
                <div class="sub" id="resumoSub">—</div>
            </div>

            <div class="certificados-header">
                <h2>🏆 Meus Certificados</h2>
                <span class="contagem" id="contagemCertificados">—</span>
            </div>

            <div class="filtros-cert">
                <input id="buscaCertificado" type="text" placeholder="🔎 Buscar pelo título do certificado..." />
                <a href="../configuracoes/alterar-usuario.html" class="gerenciar">✏️ Gerenciar certificações</a>
            </div>

            <div id="certificadosContainer" class="certificados-grid">
                <div class="secao-vazia">Carregando seus certificados...</div>
            </div>

        </main>
    </div>

    <script src="../js/auth.js"></script>
    <script src="../js/logout.js"></script>
    <script src="certificadosProfessor.js"></script>
</body>

</html>
