<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Editar Perfil - CesarEdu</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header class="navbar">
        <div class="logo">
            <img src="../img/cesar_edu.png" />
            <a href="../home/home.html">CesarEdu</a>
        </div>

        <input class="search" type="text" placeholder="O que você quer aprender?" />

        <div class="perfil">
            <span id="userName">Usuário</span>

            <button onclick="logout()" class="logout-btn">Sair</button>
        </div>
    </header>

    <div class="layout">

        <aside class="sidebar" id="sidebarAlterar">
            <!-- Preenchida via JS de acordo com o tipo de usuário -->
        </aside>

        <main class="conteudo">
            <div class="form-container">

                <h2>Editar Perfil</h2>

                <div id="erroMsg"></div>

                <!-- CPF (não editável) -->
                <div class="form-group">
                    <label>CPF</label>
                    <input type="text" id="cpf" disabled>
                </div>

                <!-- Nome -->
                <div class="form-group">
                    <label>Nome completo</label>
                    <input type="text" id="nome">
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email">
                </div>

                <!-- Senha -->
                <div class="form-group">
                    <label>Nova senha</label>
                    <input type="password" id="password">
                    <small>Deixe em branco se não quiser alterar</small>
                </div>

                <!-- CEP -->
                <div class="form-group">
                    <label>CEP</label>
                    <input type="text" id="cep" onblur="buscarCEP(this.value)">
                </div>

                <!-- Endereço -->
                <div class="form-group">
                    <label>Logradouro</label>
                    <input type="text" id="logradouro">
                </div>

                <div class="form-group">
                    <label>Número</label>
                    <input type="text" id="numero">
                </div>

                <!-- Telefones -->
                <div class="form-group">
                    <label>Telefones</label>
                    <input type="text" id="telefoneInput">
                    <button type="button" onclick="addTelefone()">Adicionar telefone</button>
                    <div id="telefoneList"></div>
                </div>

                <!-- Certificações -->
                <div id="certificacoesContainer" class="hidden">
                    <div class="form-group">
                        <label>Certificações</label>
                        <input type="text" id="certInput">
                        <button type="button" onclick="addCert()">Adicionar certificação</button>
                        <div id="certList"></div>
                    </div>
                </div>

                <!-- BOTÃO -->
                <button class="btn" onclick="atualizarUsuario()">Salvar alterações</button>

            </div>
        </main>
    </div>

    <script src="alterar.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/logout.js"></script>
        <script src="addTelefone.js"></script>
    <script src="addCertificacao.js"></script>
</body>

</html>
