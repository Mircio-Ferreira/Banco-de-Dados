<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Editar Perfil - CesarEdu</title>
    <link rel="stylesheet" href="../css/style.css">

    <style>
        .editar-page {
            max-width: 760px;
            margin: 24px auto 60px;
            padding: 0 18px;
        }

        .perfil-banner {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.15), rgba(99, 102, 241, 0.15));
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 14px;
            padding: 22px 24px;
            display: flex;
            align-items: center;
            gap: 18px;
            margin-bottom: 22px;
        }

        .perfil-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f97316, #fb923c);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8em;
            font-weight: 800;
            color: white;
            box-shadow: 0 6px 16px rgba(249, 115, 22, 0.4);
        }

        .perfil-banner .info h2 {
            margin: 0 0 4px 0;
            font-size: 1.4em;
            color: #f1f5f9;
        }

        .perfil-banner .info p {
            margin: 0;
            color: #94a3b8;
            font-size: 0.9em;
        }

        .perfil-banner .badge-tipo {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.75em;
            font-weight: 700;
            margin-top: 6px;
            background: rgba(34, 197, 94, 0.18);
            color: #86efac;
            border: 1px solid rgba(34, 197, 94, 0.4);
        }

        .perfil-banner .badge-tipo.prof {
            background: rgba(168, 85, 247, 0.18);
            color: #d8b4fe;
            border-color: rgba(168, 85, 247, 0.45);
        }

        .section-card {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 20px 22px;
            margin-bottom: 18px;
            backdrop-filter: blur(8px);
        }

        .section-card h3 {
            margin: 0 0 16px 0;
            font-size: 1em;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        .field.full { grid-column: 1 / -1; }

        .field label {
            font-size: 0.78em;
            margin-bottom: 6px;
            color: #cbd5e1;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .field input {
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(2, 6, 23, 0.6);
            color: #f1f5f9;
            font-size: 0.92em;
            transition: 0.15s;
        }

        .field input:disabled {
            background: rgba(2, 6, 23, 0.35);
            color: #64748b;
            cursor: not-allowed;
        }

        .field input:focus {
            outline: none;
            border-color: rgba(56, 189, 248, 0.5);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        .field small {
            color: #94a3b8;
            font-size: 0.75em;
            margin-top: 4px;
        }

        .list-input {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }

        .list-input input { flex: 1; }

        .list-input button {
            padding: 0 14px;
            background: rgba(56, 189, 248, 0.18);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #bae6fd;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: 600;
            white-space: nowrap;
        }

        .telefone-list,
        .cert-list {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .telefone-list:empty::before,
        .cert-list:empty::before {
            content: "Nenhum item cadastrado.";
            color: #64748b;
            font-size: 0.82em;
            font-style: italic;
        }

        .submit-bar {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        .btn-salvar {
            flex: 1;
            padding: 13px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            border: none;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            font-size: 1em;
            font-weight: 700;
            box-shadow: 0 4px 16px rgba(37, 99, 235, 0.35);
            transition: 0.15s;
        }

        .btn-salvar:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
        }

        .btn-cancelar {
            padding: 13px 22px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            color: #cbd5e1;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-cancelar:hover {
            background: rgba(255, 255, 255, 0.05);
            color: white;
        }

        .hidden { display: none !important; }

        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>

    <header class="navbar">
        <a class="logo" href="../home/home.html">
            <img src="../img/cesar_edu.png" />
            <div>
                <span style="font-size: 22px; font-weight: 800;">CesarEdu</span>
                <div class="logo-tagline">Educação que conecta</div>
            </div>
        </a>

        <input class="search" type="text" placeholder="🔎 Pesquisar..." />

        <div class="perfil">
            <span id="userName">Usuário</span>
            <button onclick="logout()" class="logout-btn">Sair</button>
        </div>
    </header>

    <div class="layout">

        <aside class="sidebar" id="sidebarAlterar">
            <!-- Preenchida via JS de acordo com o tipo de usuário -->
        </aside>

        <main class="conteudo">
            <div class="editar-page">

                <div class="perfil-banner">
                    <div class="perfil-avatar" id="perfilAvatar">U</div>
                    <div class="info">
                        <h2 id="perfilNome">—</h2>
                        <p id="perfilEmail">—</p>
                        <span class="badge-tipo" id="perfilBadge">ALUNO</span>
                    </div>
                </div>

                <div id="erroMsg"></div>

                <section class="section-card">
                    <h3>👤 Dados pessoais</h3>
                    <div class="form-grid">
                        <div class="field">
                            <label>CPF</label>
                            <input type="text" id="cpf" disabled>
                            <small>O CPF não pode ser alterado.</small>
                        </div>
                        <div class="field">
                            <label>Nome completo</label>
                            <input type="text" id="nome">
                        </div>
                        <div class="field">
                            <label>Email</label>
                            <input type="email" id="email">
                        </div>
                        <div class="field">
                            <label>Nova senha</label>
                            <input type="password" id="password" placeholder="••••••••">
                            <small>Deixe em branco para manter a senha atual.</small>
                        </div>
                    </div>
                </section>

                <section class="section-card">
                    <h3>📍 Endereço</h3>
                    <div class="form-grid">
                        <div class="field">
                            <label>CEP</label>
                            <input type="text" id="cep" onblur="buscarCEP(this.value)">
                        </div>
                        <div class="field">
                            <label>Número</label>
                            <input type="text" id="numero">
                        </div>
                        <div class="field full">
                            <label>Logradouro</label>
                            <input type="text" id="logradouro">
                        </div>
                    </div>
                </section>

                <section class="section-card">
                    <h3>📞 Telefones</h3>
                    <div class="list-input">
                        <input type="text" id="telefoneInput" placeholder="(xx) xxxxx-xxxx">
                        <button type="button" onclick="addTelefone()">+ Adicionar</button>
                    </div>
                    <div id="telefoneList" class="telefone-list"></div>
                </section>

                <section class="section-card hidden" id="certificacoesContainer">
                    <h3>🏆 Certificações</h3>
                    <p style="color:#94a3b8; font-size: 0.85em; margin: 0 0 10px 0;">
                        Suas certificações aparecem na sua tela de Certificados.
                    </p>
                    <div class="list-input">
                        <input type="text" id="certInput" placeholder="Ex: AWS Solutions Architect">
                        <button type="button" onclick="addCert()">+ Adicionar</button>
                    </div>
                    <div id="certList" class="cert-list"></div>
                </section>

                <div class="submit-bar">
                    <a href="../configuracoes/configuracoes.html" class="btn-cancelar">Cancelar</a>
                    <button class="btn-salvar" onclick="atualizarUsuario()">💾 Salvar alterações</button>
                </div>

            </div>
        </main>
    </div>

    <script src="alterar.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/logout.js"></script>
    <script src="addTelefone.js"></script>
    <script src="addCertificacao.js"></script>

    <script>
        // Inicializa CEP loader
        function buscarCEP(cep) {
            cep = (cep || "").replace(/\D/g, "");
            if (cep.length !== 8) return;
            fetch(`https://viacep.com.br/ws/${cep}/json/`)
                .then(r => r.json())
                .then(d => {
                    if (d.erro) return;
                    const log = document.getElementById("logradouro");
                    if (log && !log.value) log.value = d.logradouro || "";
                })
                .catch(() => {});
        }

        // Banner do perfil
        document.addEventListener("DOMContentLoaded", () => {
            const u = JSON.parse(localStorage.getItem("user") || "{}");
            const nome = u?.nome || "Usuário";
            document.getElementById("perfilNome").textContent  = nome;
            document.getElementById("perfilEmail").textContent = u?.email || "—";
            document.getElementById("perfilAvatar").textContent = (nome.charAt(0) || "U").toUpperCase();

            const badge = document.getElementById("perfilBadge");
            if (u?.tipoUsuario === "PROFESSOR") {
                badge.textContent = "🎓 Professor";
                badge.classList.add("prof");
            } else {
                badge.textContent = "📚 Aluno";
            }
        });
    </script>
</body>

</html>
