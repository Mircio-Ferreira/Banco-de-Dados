<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Configurações - CesarEdu</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- 🔝 NAVBAR -->
    <header class="navbar">
        <div class="logo">
            <img src="../img/cesar_edu.png" />
            <a href="../home/home.html">CesarEdu</a>
        </div>

        <input class="search" type="text" placeholder="O que você quer aprender?" />

        <div class="perfil">
            <span id="userName">Usuário</span>

            <button onclick="logout()" class="logout-btn">Sair</button>
        </div>
    </header>

    <div class="layout">

        <!-- 📌 SIDEBAR -->
        <aside class="sidebar" id="sidebarConfig">
            <!-- Preenchida via JS de acordo com o tipo de usuário -->
        </aside>

        <!-- 📊 CONTEÚDO -->
        <main class="conteudo">

            <section class="config-box">
                <h2>⚙️ Configurações da Conta</h2>

                <!-- INFO -->
                <div class="config-item">
                    <h3>👤 Dados da conta</h3>
                    <p>Atualize suas informações pessoais.</p>
                    <button class="btn btn-secondary" onclick="alterarPage()">
                        Editar perfil
                    </button >
                </div>

                <!-- SEGURANÇA -->
                <div class="config-item">
                    <h3>🔒 Segurança</h3>
                    <p>Altere sua senha ou dados de login.</p>
                    <button class="btn btn-secondary">
                        Alterar senha
                    </button>
                </div>

                <!-- EXCLUIR -->
                <div class="config-item danger">
                    <h3>⚠️ Zona de perigo</h3>
                    <p>Excluir sua conta é uma ação permanente.</p>

                    <button class="btn btn-danger" onclick="deletarConta()">
                        Excluir conta
                    </button>
                </div>

                <div id="erroConfig"></div>

            </section>

        </main>
    </div>

    <script src="config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/logout.js"></script>
</body>

</html>
