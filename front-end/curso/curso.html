<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Assistir Aula - CesarEdu</title>
    <link rel="stylesheet" href="../css/style.css">

    <style>

    </style>
</head>

<body>

    <header class="navbar">
        <div class="logo">
            <img src="../img/cesar_edu.png" />
            <a href="../home/home.html">CesarEdu</a>
        </div>

        <input class="search" type="text" placeholder="O que você quer aprender?" />

        <div class="perfil">
            <span id="userName">Usuário</span>

            <button onclick="logout()" class="logout-btn">Sair</button>
        </div>
    </header>

    <div class="layout">

        <!-- Sidebar -->
        <aside class="aulas-sidebar" id="sidebar"></aside>

        <!-- Conteúdo principal -->
        <main class="conteudo">
            <div class="player-content">

                <div class="video" id="video"></div>

                <div class="info-box">
                    <h2 id="tituloAula"></h2>
                    <p id="descricaoAula"></p>
                </div>

                <div class="materiais-box">
                    <h3>Materiais</h3>
                    <div class="materiais" id="materiais"></div>
                </div>

                <div class="comentarios-box">
                    <h3>Comentários</h3>

                    <!-- Novo comentário -->
                    <div class="novo-comentario">
                        <textarea id="comentarioInput" placeholder="Escreva um comentário..."></textarea>
                        <button onclick="addComentario()">Comentar</button>
                    </div>

                    <!-- Lista -->
                    <div id="comentariosList"></div>
                </div>

            </div>
        </main>

    </div>

    <script src="curso.js"></script>
    <script src="comentario.js"></script>
    <script src="../js/auth.js"></script>
</body>

</html>
