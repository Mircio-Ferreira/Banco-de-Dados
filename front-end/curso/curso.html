<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Assistir Aula - CesarEdu</title>
    <link rel="stylesheet" href="../css/style.css">

    <style>

    </style>
</head>

<body>

    <header class="navbar">
        <div class="logo">
            <a href="../home/home.html">CesarEdu</a>
        </div>

        <div class="perfil">
            <img
                src="https://s2-techtudo.glbimg.com/PubgcFXGejS1Z3icyJyUibMpU7s=/0x0:300x304/984x0/smart/filters:strip_icc()/i.s3.glbimg.com/v1/AUTH_08fbf48bc0524877943fe86e43087e7a/internal_photos/bs/2021/j/W/QU9NeQT5yDTg5VqykCuQ/2012-04-20-linus-torvalds.jpg" />
            <span>Eric</span>
        </div>
    </header>

    <div class="layout">

        <!-- Sidebar -->
        <aside class="aulas-sidebar" id="sidebar"></aside>

        <!-- Conteúdo principal -->
        <main class="conteudo">
            <div class="player-content">

                <div class="video" id="video"></div>

                <div class="info-box">
                    <h2 id="tituloAula"></h2>
                    <p id="descricaoAula"></p>
                </div>

                <div class="materiais-box">
                    <h3>Materiais</h3>
                    <div class="materiais" id="materiais"></div>
                </div>

                <div class="comentarios-box">
                    <h3>Comentários</h3>

                    <!-- Novo comentário -->
                    <div class="novo-comentario">
                        <textarea id="comentarioInput" placeholder="Escreva um comentário..."></textarea>
                        <button onclick="addComentario()">Comentar</button>
                    </div>

                    <!-- Lista -->
                    <div id="comentariosList"></div>
                </div>

            </div>
        </main>

    </div>

    <script src="curso.js"></script>
    <script src="comentario.js"></script>

</body>

</html>
