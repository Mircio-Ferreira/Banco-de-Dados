<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Editar Curso - CesarEdu</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<style>
    .form-container {
        max-width: 920px;
        margin: 0 auto;
    }
    .form-container > h2 {
        margin: 0 0 20px 0;
        font-size: 1.6em;
        color: #f1f5f9;
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .form-container > h2::before {
        content: "✏️";
        font-size: 1em;
    }

    .box {
        background: rgba(15, 23, 42, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.06);
        padding: 18px 20px;
        border-radius: 12px;
        margin-bottom: 16px;
    }
    .box h3, .box h4 {
        margin: 0 0 14px 0;
        font-size: 1.02em;
        color: #f1f5f9;
        padding-bottom: 8px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .box h4 { font-size: 0.95em; }

    input, textarea {
        width: 100%;
        padding: 10px 12px;
        margin-top: 4px;
        margin-bottom: 12px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: #0f172a;
        color: #e2e8f0;
        font-size: 0.92em;
        font-family: inherit;
        box-sizing: border-box;
        transition: border-color 0.15s, box-shadow 0.15s;
    }
    input::placeholder, textarea::placeholder {
        color: #64748b;
    }
    input:focus, textarea:focus {
        outline: none;
        border-color: rgba(56, 189, 248, 0.55);
        box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }
    textarea { min-height: 80px; resize: vertical; }

    button {
        margin-top: 6px;
        padding: 8px 14px;
        border-radius: 8px;
        border: 1px solid rgba(56, 189, 248, 0.35);
        background: rgba(56, 189, 248, 0.12);
        color: #bae6fd;
        cursor: pointer;
        font-size: 0.88em;
        font-weight: 500;
        transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }
    button:hover {
        background: rgba(56, 189, 248, 0.22);
        border-color: rgba(56, 189, 248, 0.55);
    }
    button:active { transform: translateY(1px); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    #btnSalvar {
        background: linear-gradient(135deg, rgba(34, 197, 94, 0.28), rgba(34, 197, 94, 0.18));
        border-color: rgba(34, 197, 94, 0.5);
        color: #86efac;
        padding: 12px 24px;
        font-size: 0.95em;
        font-weight: 600;
        margin-top: 12px;
    }
    #btnSalvar:hover {
        background: linear-gradient(135deg, rgba(34, 197, 94, 0.4), rgba(34, 197, 94, 0.28));
        border-color: rgba(34, 197, 94, 0.7);
    }

    .btn-danger {
        background: linear-gradient(135deg, rgba(239, 68, 68, 0.25), rgba(239, 68, 68, 0.15));
        border: 1px solid rgba(239, 68, 68, 0.5);
        color: #fca5a5;
        padding: 12px 22px;
        font-size: 0.95em;
        font-weight: 600;
        margin-top: 12px;
        margin-left: 10px;
    }
    .btn-danger:hover {
        background: linear-gradient(135deg, rgba(239, 68, 68, 0.4), rgba(239, 68, 68, 0.25));
        border-color: rgba(239, 68, 68, 0.7);
    }

    .remove-btn {
        background: rgba(239, 68, 68, 0.15);
        color: #fca5a5;
        border: 1px solid rgba(239, 68, 68, 0.4);
        border-radius: 6px;
        padding: 4px 10px;
        margin-left: 8px;
        font-size: 0.76em;
        font-weight: 500;
    }
    .remove-btn:hover {
        background: rgba(239, 68, 68, 0.28);
        border-color: rgba(239, 68, 68, 0.65);
    }

    .nested {
        margin-top: 12px;
        margin-left: 8px;
        border-left: 2px solid rgba(56, 189, 248, 0.25);
        padding-left: 14px;
    }
    .nested .box {
        background: rgba(15, 23, 42, 0.4);
        border-style: dashed;
        border-color: rgba(255, 255, 255, 0.08);
        padding: 14px 16px;
    }

    .status {
        margin-top: 18px;
        padding: 12px 14px;
        border-radius: 8px;
        font-size: 0.9em;
        white-space: pre-line;
        display: none;
        border: 1px solid transparent;
    }
    .status.info { background: rgba(56, 189, 248, 0.12); border-color: rgba(56, 189, 248, 0.4); color: #bae6fd; display: block; }
    .status.ok   { background: rgba(34, 197, 94, 0.15); border-color: rgba(34, 197, 94, 0.4); color: #86efac; display: block; }
    .status.err  { background: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.4); color: #fca5a5; display: block; }

    .tag-novo {
        font-size: 0.7em;
        background: rgba(34, 197, 94, 0.25);
        color: #86efac;
        border: 1px solid rgba(34, 197, 94, 0.4);
        padding: 2px 8px;
        border-radius: 10px;
        margin-left: 8px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.4px;
    }

    #categoriaList > div {
        display: inline-flex;
        align-items: center;
        background: rgba(99, 102, 241, 0.18);
        color: #c7d2fe;
        border: 1px solid rgba(99, 102, 241, 0.35);
        padding: 4px 4px 4px 12px;
        border-radius: 14px;
        margin: 6px 6px 0 0;
        font-size: 0.85em;
    }
    #categoriaList > div .remove-btn {
        margin-left: 6px;
        padding: 2px 8px;
        font-size: 0.72em;
    }
</style>

<body>

    <header class="navbar">
        <div class="logo">
            <img src="../img/cesar_edu.png" />
            <a href="../home/home-professor.html">CesarEdu</a>
        </div>

        <input class="search" type="text" placeholder="Buscar..." />

        <div class="perfil">
            <span id="userName">Usuário</span>
            <button onclick="logout()" class="logout-btn">Sair</button>
        </div>
    </header>

    <div class="layout">

        <aside class="sidebar">
            <a href="../home/home-professor.html">🏠 Início</a>
            <a href="../certificados/certificadosProfessor.html">🏆 Certificados</a>
            <a href="../addCurso/addCurso.html">➕ Criar curso</a>
            <a href="../dashboardPreco/dashboardPreco.html">📊 Dashboard de Preços</a>
            <a href="../dashboardAlunosInativos/dashboardAlunosInativos.html">😴 Alunos Inativos</a>
            <a href="../dashboardConsultas/dashboardConsultas.html">📈 Consultas SQL</a>
            <a href="../dashboardProfessores/dashboardProfessores.html">🏆 Comparar Professores</a>
            <a href="../configuracoes/configuracoes.html">⚙️ Configurações</a>
        </aside>

        <main class="conteudo">
            <div class="form-container">

                <h2>Editar Curso</h2>

                <!-- 📚 CURSO -->
                <div class="box">
                    <h3>Curso</h3>
                    <input id="nomeCurso" placeholder="Nome do curso">
                    <input id="precoCurso" type="number" min="0" step="0.01" placeholder="Preço">
                    <textarea id="descricaoCurso" placeholder="Descrição"></textarea>
                </div>

                <!-- 🏷️ CATEGORIAS -->
                <div class="box">
                    <h3>Categorias</h3>
                    <input type="text" id="categoriaInput" placeholder="Ex: Programação, IA">
                    <button type="button" onclick="addCategoria()">Adicionar categoria</button>
                    <div id="categoriaList"></div>
                </div>

                <!-- 📦 MÓDULOS -->
                <div class="box">
                    <h3>Módulos</h3>
                    <button onclick="addModulo()">Adicionar módulo</button>
                    <div id="modulos"></div>
                </div>

                <button id="btnSalvar" onclick="atualizarCurso()">Salvar Alterações</button>

                <button onclick="deletarCurso()" class="btn-danger">
                    🗑️ Deletar Curso
                </button>

                <div id="status" class="status"></div>
            </div>
        </main>
    </div>

    <script src="../js/auth.js"></script>
    <script src="../js/logout.js"></script>
    <script src="../js/reloadStorage.js"></script>
    <script src="editar.js"></script>
</body>

</html>
