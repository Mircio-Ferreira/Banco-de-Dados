<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Painel do Professor - CesarEdu</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- 🔝 NAVBAR -->
    <header class="navbar">
        <div class="logo">
            <img src="../img/cesar_edu.png" />
            <a href="../home/home.html">CesarEdu</a>
        </div>

        <input class="search" type="text" placeholder="O que você quer aprender?" />

        <div class="perfil">
            <span id="userName">Usuário</span>

            <button onclick="logout()" class="logout-btn">Sair</button>
        </div>
    </header>

    <div class="layout">

        <!-- 📌 SIDEBAR -->
        <aside class="sidebar">
            <a href="#">🏆 Certificados</a>
            <a href="../addCurso/addCurso.html">➕ Criar curso</a>
            <a href="../configuracoes/configuracoes.html">⚙️ Configurações</a>
        </aside>

        <!-- 📊 CONTEÚDO -->
        <main class="conteudo">

            <!-- 📚 MEUS CURSOS -->
            <section>
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <h2>Meus Cursos</h2>

                    <!-- 🚀 ATALHO -->
                    <a href="../addCurso/addCurso.html">
                        <button>➕ Novo Curso</button>
                    </a>
                </div>

                <div class="carrossel-wrapper">
                    <button class="scroll-btn left" onclick="scrollCarrossel(this, -1)">❮</button>

                    <div class="carrossel" id="carrosselCursosProfessor">
                        <!-- JS vai inserir aqui -->
                    </div>

                    <button class="scroll-btn right" onclick="scrollCarrossel(this, 1)">❯</button>
                </div>
            </section>

            <!-- 💸 DESCONTO POR CATEGORIA -->
            <section style="margin-top: 30px;">
                <h2>Aplicar desconto em categoria</h2>
                <p style="opacity:0.8; font-size:0.9em;">
                    Aplica um desconto percentual a todos os cursos da categoria informada.
                </p>

                <div class="desconto-form">
                    <input id="descontoCategoria" type="text" placeholder="Categoria (ex: Programação)">
                    <input id="descontoValor" type="number" min="0" max="100" step="0.01" placeholder="Desconto (%)">
                    <button id="btnAplicarDesconto" onclick="aplicarDesconto()">Aplicar</button>
                </div>

                <div id="descontoStatus" class="desconto-status"></div>
            </section>
        </main>
    </div>

    <style>
        .desconto-form {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            margin-top: 10px;
        }
        .desconto-form input {
            flex: 1;
            min-width: 180px;
            padding: 8px;
            border-radius: 6px;
            border: none;
        }
        .desconto-form button {
            padding: 8px 14px;
            cursor: pointer;
        }
        .desconto-status {
            margin-top: 12px;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9em;
            display: none;
        }
        .desconto-status.info { background: rgba(52, 152, 219, 0.2); display: block; }
        .desconto-status.ok   { background: rgba(46, 204, 113, 0.25); display: block; }
        .desconto-status.err  { background: rgba(231, 76, 60, 0.25); display: block; }
    </style>

    <!-- 📜 SCRIPT -->
    <script>
        function carregarCursosProfessor() {
            const cursos = []

            const cursosLecionados = currentUser.cursosLecionados

            for (const c of cursosLecionados) {
                cursos.push({
                    nome: c.nome_curso,
                    id: c.id_curso
                })
            }

            const container = document.getElementById("carrosselCursosProfessor");

            cursos.forEach(curso => {
                const div = document.createElement("div");
                div.classList.add("card", "card-curso");

                div.innerHTML = `
                    <img src="${curso.imagem}" class="thumb"/>
                    <h3>${curso.nome}</h3>
                `;

                div.addEventListener("click", () => {
                    window.location.href = `../editarCurso/editarCurso.html?id=${curso.id}`;
                });

                container.appendChild(div);
            });
        }

        window.onload = carregarCursosProfessor;
    </script>

    <script src="scrollCarrossel.js"></script>
    <script src="desconto.js"></script>
    <script src="cursoDirect.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/logout.js"></script>
    <script src="../js/reloadStorage.js"></script>
</body>

</html>
